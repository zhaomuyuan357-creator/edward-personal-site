<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站内容编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3ef;color:#20221c;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{position:sticky;top:0;z-index:3;background:#f8f8f4ed;backdrop-filter:blur(15px);border-bottom:1px solid #d9dccf;padding:19px max(24px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:19px;margin:0;letter-spacing:-.03em}.actions{display:flex;gap:10px}button,.button{font:inherit;font-size:12px;border:1px solid #cfd2c5;border-radius:7px;padding:11px 16px;color:inherit;text-decoration:none;background:#fff;cursor:pointer;display:inline-block}button:disabled{opacity:.5;cursor:wait}.primary{background:#20251a;color:#fff;border-color:#20251a}.layout{max-width:1080px;margin:40px auto 80px;padding:0 24px;display:grid;grid-template-columns:180px 1fr;gap:38px}aside{position:sticky;top:110px;align-self:start}aside a{display:block;text-decoration:none;color:#555f4a;margin:0 0 18px;font-size:13px}.note{color:#7a8171;font-size:12px;line-height:1.9;margin-top:30px}section{background:#fff;border:1px solid #e0e2d8;border-radius:12px;padding:28px;margin-bottom:24px;scroll-margin-top:100px}h2{font-size:20px;letter-spacing:-.03em;margin:0 0 8px}.intro{font-size:12px;color:#7a8171;line-height:1.8;margin:0 0 24px}label{display:block;font-size:12px;font-weight:500;margin-bottom:17px}label>span{display:block;margin-bottom:8px}input,textarea{width:100%;font:inherit;font-size:13px;line-height:1.6;background:#fafbf7;border:1px solid #dce0d2;border-radius:7px;padding:10px 12px;color:#293020}input:focus,textarea:focus{outline:2px solid #899f64;outline-offset:1px}textarea{min-height:86px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.helper{font-size:11px;color:#7d8573;line-height:1.7;margin-top:7px}.project{border-top:1px solid #e0e2d8;padding-top:24px;margin-top:25px}.project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.project-head h3{font-size:16px;margin:0}.danger{color:#986350;font-size:11px;padding:7px 10px}.preview{width:100%;height:200px;object-fit:cover;border-radius:7px;margin-bottom:15px;background:#f0f2ea}.upload-row{display:flex;align-items:center;gap:12px;margin:0 0 20px}.upload-row input{font-size:11px;max-width:100%;padding:8px}.social{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin-bottom:13px}.social button{padding:10px}.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 24px;background:#26371b;color:white;border-radius:9px;font-size:13px;box-shadow:0 6px 20px #0002;max-width:90vw;z-index:5}.status.error{background:#8c3926}[hidden]{display:none!important}.loading{padding:40px;color:#6e7662}#add-project,#add-social{margin-top:15px}.save-reminder{font-size:11px;color:#7a8171}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}
@media(max-width:700px){header{padding:15px 18px}h1{font-size:16px}.layout{display:block;padding:0 16px;margin-top:23px}aside{position:static;display:flex;gap:25px;margin-bottom:16px}aside .note{display:none}section{padding:22px}.row{grid-template-columns:1fr;gap:0}.save-reminder{display:none}.social{grid-template-columns:90px 1fr 38px}}
</style></head>
<body><header><h1>✳ 网站内容编辑</h1><div class="actions"><a class="button" href="/" target="_blank" rel="noopener">预览网站 ↗</a><button class="primary" id="save" disabled>保存到本机</button></div></header><div class="layout"><aside><a href="#identity">个人介绍</a><a href="#works">照片与视频</a><a href="#contact">联系方式</a><p class="note">这个编辑页面只在你的电脑上开放。<br><br>保存后刷新预览即可看到变化。已经上线的网站，需要重新上传生成的上线包才会更新。</p></aside><main id="editor"><p class="loading">正在读取内容…</p></main></div><div class="status" id="status" role="status" hidden></div>
<script>
"use strict";
const token = "__EDITOR_TOKEN__";
let content, dirty = false, toastTimer;
const root = document.querySelector("#editor");
const make = (tag, cls, text) => {const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;};
const toast = (message,error=false) => {const el=document.querySelector("#status");clearTimeout(toastTimer);el.textContent=message;el.classList.toggle("error",error);el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,6000);};
function field(object,key,label,multiline=false,hint=""){
 const wrap=make("label"),title=make("span","",label),input=make(multiline?"textarea":"input");
 input.value=object[key]||"";input.setAttribute("aria-label",label);
 input.addEventListener("input",()=>{object[key]=input.value;dirty=true;});
 wrap.append(title,input);if(hint)wrap.append(make("p","helper",hint));return wrap;
}
function section(id,title,description){const el=make("section");el.id=id;el.append(make("h2","",title),make("p","intro",description));root.append(el);return el;}
function row(...children){const el=make("div","row");el.append(...children);return el;}
function upload(object,key,label,accept,after){
 const wrap=make("label","upload-row"),input=make("input");input.type="file";input.accept=accept;input.setAttribute("aria-label",label);wrap.append(make("span","",label),input);
 input.addEventListener("change",async()=>{const file=input.files[0];if(!file)return;if(file.size>=25*1024*1024){toast("单个文件请控制在 25 MB 以内。",true);return;}input.disabled=true;
 try{const response=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":file.type,"X-Editor-Token":token},body:file});const data=await response.json();if(!response.ok)throw new Error(data.error);object[key]=data.path;dirty=true;if(after)after(data.path);toast("文件已加入本机素材，记得点“保存到本机”。");}catch(error){toast(error.message,true);}finally{input.disabled=false;}});return wrap;
}
function render(){
 root.replaceChildren();
 const basic=section("identity","你好，"+content.name+"。","这里修改网站首页与“关于我”。换行会保留在页面上。");
 basic.append(row(field(content,"name","名字或昵称"),field(content,"wordmark","首页大字")),field(content,"role","身份介绍"),field(content,"intro","首页介绍",true),field(content,"aboutTitle","关于我的标题",true),field(content,"aboutText","关于我的正文",true));
 const tagHolder={tags:content.tags.join("、")};const tags=field(tagHolder,"tags","个人标签",false,"用顿号、逗号分隔，例如：AI 实验、摄影记录、自由创作");tags.querySelector("input").addEventListener("input",()=>content.tags=tagHolder.tags.split(/[、,，]/).map(x=>x.trim()).filter(Boolean));basic.append(tags);
 const portrait=make("img","preview");portrait.src=content.aboutImage||"";portrait.alt="关于我的照片";portrait.style.objectPosition="50% 40%";basic.append(portrait,upload(content,"aboutImage","替换个人照片","image/jpeg,image/png,image/webp",path=>portrait.src=path));
 const works=section("works","照片与视频","可以改标题、分类、说明，也可以添加新的影像。网站会根据你填写的分类自动生成筛选按钮。");
 content.projects.forEach((project,index)=>{
  const item=make("div","project"),heading=make("div","project-head"),remove=make("button","danger","移除");remove.type="button";heading.append(make("h3","",String(index+1).padStart(2,"0")+" / "+project.title),remove);remove.addEventListener("click",()=>{content.projects.splice(index,1);dirty=true;render();});
  const image=make("img","preview");image.src=project.image;image.alt=project.alt||project.title;image.style.objectPosition=project.position||"50% 50%";
  item.append(heading,image,upload(project,"image","替换封面","image/jpeg,image/png,image/webp",path=>image.src=path));
  item.append(row(field(project,"title","作品名称"),field(project,"englishTitle","英文副标题（可留空）")),row(field(project,"category","分类"),field(project,"year","年份（可留空）")),field(project,"description","作品说明",true),field(project,"alt","图片文字说明",false,"帮助使用读屏工具的访客了解画面。"),field(project,"position","封面取景位置",false,"默认 50% 50%。竖图想多显示上半部，可以写 50% 30%。"),field(project,"link","项目外部链接（可留空）"));
  item.append(upload(project,"video","添加 / 替换视频","video/mp4,video/webm",()=>{delete project.videoWebm;render();}));
  if(project.video){const videoNote=make("p","helper","已添加视频。访客点击此卡片后，可以播放。");const noVideo=make("button","danger","移除视频，仅显示图片");noVideo.type="button";noVideo.addEventListener("click",()=>{delete project.video;delete project.videoWebm;dirty=true;render();});item.append(videoNote,noVideo);}
  const demo=make("label","check"),box=make("input");box.type="checkbox";box.checked=!!project.demo;box.addEventListener("change",()=>{project.demo=box.checked;dirty=true;});demo.append(box,document.createTextNode("标注为示例作品"));item.append(demo);works.append(item);
 });
 const add=make("button","","＋ 添加一件作品");add.id="add-project";add.type="button";add.addEventListener("click",()=>{content.projects.push({id:"project-"+Date.now(),title:"新作品",englishTitle:"",category:"人像记录",year:"",image:content.aboutImage||"assets/edward-lanterns.webp",alt:"",description:"",link:"",demo:false,position:"50% 50%"});dirty=true;render();document.querySelectorAll(".project")[content.projects.length-1].scrollIntoView({behavior:"smooth"});});works.append(add);
 const contact=section("contact","保持联系","只填写你愿意公开展示的联系方式。邮箱留空时，网站不会显示虚构的邮箱或发送按钮。");contact.append(field(content,"email","联系邮箱"));
 content.socials.forEach((social,index)=>{const el=make("div","social"),label=make("input"),url=make("input"),remove=make("button","","×");label.value=social.label;label.placeholder="平台名称";label.setAttribute("aria-label","社交平台名称");url.value=social.url;url.placeholder="https://...";url.setAttribute("aria-label","社交平台网址");label.oninput=()=>{social.label=label.value;dirty=true;};url.oninput=()=>{social.url=url.value;dirty=true;};remove.setAttribute("aria-label","移除此社交链接");remove.onclick=()=>{content.socials.splice(index,1);dirty=true;render();};el.append(label,url,remove);contact.append(el);});
 const addSocial=make("button","","＋ 添加社交链接");addSocial.id="add-social";addSocial.onclick=()=>{content.socials.push({label:"",url:""});dirty=true;render();};contact.append(addSocial);document.querySelector("#save").disabled=false;
}
document.querySelector("#save").addEventListener("click",async()=>{const button=document.querySelector("#save");button.disabled=true;button.textContent="正在保存…";try{const response=await fetch("/api/content",{method:"POST",headers:{"Content-Type":"application/json","X-Editor-Token":token},body:JSON.stringify(content)});const data=await response.json();if(!response.ok)throw new Error(data.error);dirty=false;toast("已保存到本机。刷新网站预览即可查看。");}catch(error){toast(error.message,true);}finally{button.disabled=false;button.textContent="保存到本机";}});
window.addEventListener("beforeunload",event=>{if(dirty){event.preventDefault();event.returnValue="";}});
fetch("/content.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("无法读取内容");return response.json();}).then(data=>{content=data;render();}).catch(error=>{root.textContent="读取失败，请重新启动本机预览后刷新。";toast(error.message,true);});
</script></body></html>
